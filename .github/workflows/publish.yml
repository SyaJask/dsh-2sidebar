# Publish the package to npm.
#
# Releases are tag-driven: pushing a tag `v<version>` whose version matches the
# root package.json runs the checks and publishes with provenance. There is no
# manual dispatch: a dispatch run is not bound to a tag, so it could publish a
# version without one.
#
# The first release has to be published by a maintainer locally, because a
# trusted publisher can only be configured for a package that already exists
# on the registry. After that, configure GitHub Actions trusted publishing for
# this repository + this workflow file and every tag push publishes with
# provenance, without any npm token.

name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  # One publish at a time across tags: a slower older release must not move
  # the `latest` dist-tag after a newer one.
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm for trusted publishing (11.5 or newer is required)
        run: npm install -g npm@11.21.1

      - name: Require a version tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "::error::publish runs only from a v* tag, not ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Check the client bundle syntax
        run: npm run check

      - name: Run the bundle and manifest tests
        run: npm test

      - name: Show the package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public
