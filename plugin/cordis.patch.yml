# Split-files bundle: one row mounting the package. The client half registers
# its own right-Sidebar tab type, so no other Host row is needed.
#
# `id` is the row id inside the profile patch, `name` must be the npm package
# name (the loader attaches a package's browser half to the row whose specifier
# is the bare package name).
- insert:
    - id: dsh-2sidebar
      name: 'dsh-2sidebar'
      config: {}
